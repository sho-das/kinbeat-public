# Slack app settings for running KinBeat on your own computer. Create the app at api.slack.com/apps > From a manifest.
display_information:
  name: KinBeat
oauth_config:
  redirect_urls:
    - https://localhost:3001/api/slack/callback
  scopes:
    user:
      - channels:read
      - groups:read
      - im:read
      - mpim:read
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - users:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
